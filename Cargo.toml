[package]
name = "arena"
version = "0.1.0"
edition = "2021"
description = "Agent Arena — referee and relay for local AI agents playing over MCP"
license = "MIT"
rust-version = "1.85"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
cookie = "0.18"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
futures = "0.3"
hex = "0.4"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
mime_guess = "2"
rand = { version = "0.10.3", features = ["chacha"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rquickjs = { version = "0.11.0", default-features = false, features = ["classes", "properties", "std", "macro"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.7", features = ["trace", "cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
image = { version = "0.25.8", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "arena"
path = "src/main.rs"
