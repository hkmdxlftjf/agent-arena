name: npm

# Disabled. Install with `npx -y github:hkmdxlftjf/agent-arena`.
# This workflow does not run on release. A manual run no-ops unless the
# confirm input is exactly "publish". That path still needs the NPM_TOKEN secret.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to upload packages/cli. Anything else no-ops.
        required: false
        default: ""

jobs:
  publish:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Publish agent-arena
        working-directory: packages/cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
