services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena
    volumes:
      - ./pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  arena:
    build: .
    environment:
      DATABASE_URL: postgres://arena:arena@postgres:5432/arena
      BIND_ADDR: 0.0.0.0:8080
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-https://arena.idou.top}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18480:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - arena
